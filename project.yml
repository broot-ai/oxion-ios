name: Oxion
options:
  bundleIdPrefix: ru.oxion
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: ru
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    TARGETED_DEVICE_FAMILY: "1"
packages:
  Lottie:
    url: https://github.com/airbnb/lottie-spm.git
    from: 4.5.0
targets:
  Oxion:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: Oxion
        excludes:
          - "Settings.bundle"
          - "Info.plist"
          - "Oxion.entitlements"
          - "Oxion.release.entitlements"
      - path: Shared
      - path: Oxion/Settings.bundle
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.oxion.app
        PRODUCT_NAME: Oxion
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Ocean AppIcon-Sunset AppIcon-Violet AppIcon-Gold AppIcon-Ruby AppIcon-Ice AppIcon-Night AppIcon-Forest AppIcon-Light"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Oxion/Info.plist
        ENABLE_PREVIEWS: YES
        CODE_SIGN_ENTITLEMENTS: Oxion/Oxion.entitlements
    dependencies:
      - package: Lottie
      - target: OxionWidget
        embed: true
    info:
      path: Oxion/Info.plist
      properties:
        CFBundleDisplayName: Oxion
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: ru
        LSRequiresIPhoneOS: true
        CFBundleLocalizations: [ru, en, fr, de]
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageRespectsSafeAreaInsets: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        LSApplicationQueriesSchemes:
          - tg
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: ru.oxion.app
            CFBundleURLSchemes:
              - oxion
        NSCameraUsageDescription: Oxion использует камеру для видеозвонков, фото и видео в ленте и чатах.
        NSMicrophoneUsageDescription: Oxion использует микрофон для звонков, голосовых и видеосообщений.
        NSPhotoLibraryUsageDescription: Oxion открывает галерею, чтобы вы могли загрузить фото и видео.
        NFCReaderUsageDescription: OXION читает NFC-метку клуба, чтобы отметить посещение.
        NSHealthShareUsageDescription: Oxion читает шаги, калории, дистанцию, сон, пульс покоя и вес из «Здоровья», чтобы показать прогресс вам и вашему тренеру.
        NSHealthUpdateUsageDescription: Oxion может сохранять ваши тренировки в «Здоровье».
        NSLocationWhenInUseUsageDescription: Oxion использует геопозицию, чтобы показать тренеров рядом.
        NSFaceIDUsageDescription: OXION использует Face ID для входа без пароля и чтобы закрывать фото прогресса, если вы включили эту защиту.
        NSAlarmKitUsageDescription: OXION ставит будильник на конец отдыха между подходами и напоминает о тренировках.
        NSBluetoothAlwaysUsageDescription: OXION подключает датчики пульса, часы и другие устройства по Bluetooth, чтобы показывать пульс во время тренировки.
        NSCalendarsWriteOnlyAccessUsageDescription: OXION добавляет занятия с тренером в ваш календарь, когда вы нажимаете «Добавить в Календарь».
        NSMotionUsageDescription: OXION считает шаги и определяет ходьбу и бег, чтобы предложить тренировку.
        NSAppleMusicUsageDescription: OXION включает музыку для тренировки из Apple Music.
        NSLocationAlwaysAndWhenInUseUsageDescription: OXION записывает маршрут пробежки, даже когда экран выключен.
        NSLocationTemporaryUsageDescriptionDictionary:
          run: Точная геопозиция нужна, чтобы правильно посчитать дистанцию и темп пробежки.
        NSContactsUsageDescription: OXION показывает ваши контакты, чтобы вы могли пригласить друзей. Контакты не отправляются на сервер.
        NSPhotoLibraryAddUsageDescription: OXION сохраняет карточки прогресса и итогов тренировки в «Фото».
        NSNearbyInteractionUsageDescription: OXION показывает расстояние и направление до пользователей OXION рядом, если вы оба открыли поиск.
        NSLocalNetworkUsageDescription: OXION ищет экраны и тренажёры в вашей сети Wi‑Fi, чтобы показать на них тренировку.
        NSBonjourServices:
          - _airplay._tcp
          - _oxion._tcp
          - _oxion-near._tcp
          - _oxion-near._udp
        UIBackgroundModes:
          - fetch
          - location
          - workout-processing
        BGTaskSchedulerPermittedIdentifiers:
          - ru.oxion.app.refresh
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: ru.oxion.workout
            UIApplicationShortcutItemTitle: Тренировка
            UIApplicationShortcutItemSubtitle: Дневник и запуск
            UIApplicationShortcutItemIconSymbolName: figure.strengthtraining.traditional
          - UIApplicationShortcutItemType: ru.oxion.qr
            UIApplicationShortcutItemTitle: Мой QR-код
            UIApplicationShortcutItemIconSymbolName: qrcode
          - UIApplicationShortcutItemType: ru.oxion.compose
            UIApplicationShortcutItemTitle: Новый пост
            UIApplicationShortcutItemIconSymbolName: square.and.pencil

  OxionWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: OxionWidget
        excludes:
          - "Info.plist"
          - "OxionWidget.entitlements"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.oxion.app.widget
        PRODUCT_NAME: OxionWidget
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: WIDGET_EXT
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: OxionWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: OxionWidget/OxionWidget.entitlements
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: ""
    info:
      path: OxionWidget/Info.plist
      properties:
        CFBundleDisplayName: Oxion
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # Приложение для Apple Watch. В тестовую сборку для Sideloadly не встраивается
  # (бесплатный Apple ID не подпишет часы) — встраивается в сборку для App Store (scripts/release_spec.rb).
  OxionWatch:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: OxionWatch
        excludes:
          - "Info.plist"
          - "OxionWatch.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.oxion.app.watchkitapp
        PRODUCT_NAME: OxionWatch
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: OxionWatch/Info.plist
        CODE_SIGN_ENTITLEMENTS: OxionWatch/OxionWatch.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
    info:
      path: OxionWatch/Info.plist
      properties:
        CFBundleDisplayName: OXION
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: ru
        WKApplication: true
        WKCompanionAppBundleIdentifier: ru.oxion.app
        NSHealthShareUsageDescription: OXION показывает пульс во время тренировки.
        NSHealthUpdateUsageDescription: OXION запускает тренировочную сессию часов, чтобы измерять пульс.
        WKBackgroundModes:
          - workout-processing

  # App Clip: мини-приложение по QR-коду / NFC-метке в зале. Как и часы — только в сборке для App Store.
  OxionClip:
    type: application.on-demand-install-capable
    platform: iOS
    sources:
      - path: OxionClip
        excludes:
          - "Info.plist"
          - "OxionClip.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.oxion.app.Clip
        PRODUCT_NAME: OxionClip
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: OxionClip/Info.plist
        CODE_SIGN_ENTITLEMENTS: OxionClip/OxionClip.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SKIP_INSTALL: YES
    info:
      path: OxionClip/Info.plist
      properties:
        CFBundleDisplayName: OXION
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: ru
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        NSAppClip:
          NSAppClipRequestEphemeralUserNotification: false
          NSAppClipRequestLocationConfirmation: false
