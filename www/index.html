<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oxion</title>
<style>
  html,body{margin:0;height:100%;background:#000;color:#cfe9a8;font-family:-apple-system,system-ui,sans-serif}
  .wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box}
  h1{color:#a6ff3a;margin:0 0 8px}
  button{margin-top:20px;background:#a6ff3a;color:#000;border:0;border-radius:14px;padding:14px 28px;font-size:17px;font-weight:600}
</style>
</head>
<body>
<!-- Эта страница показывается, только если сервер Oxion недоступен (нет интернета). -->
<div class="wrap">
  <h1>Oxion</h1>
  <p>Нет соединения с сервером.<br>Проверьте интернет и попробуйте снова.</p>
  <button onclick="location.reload()">Повторить</button>
</div>
</body>
</html>
