<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oxion</title>
<style>
  html,body{margin:0;height:100%;background:#000;color:#cfe9a8;font-family:-apple-system,system-ui,sans-serif}
  .wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box}
  img{width:96px;height:96px;border-radius:22px;margin-bottom:18px}
  h1{color:#a6ff3a;margin:0 0 8px;font-size:24px}
  p{margin:6px 0;line-height:1.4;font-size:15px;opacity:.85}
  .spin{width:28px;height:28px;border:3px solid #2a3a12;border-top-color:#a6ff3a;border-radius:50%;animation:s 0.9s linear infinite;margin-top:18px}
  @keyframes s{to{transform:rotate(360deg)}}
  button{margin-top:20px;background:#a6ff3a;color:#000;border:0;border-radius:14px;padding:14px 28px;font-size:17px;font-weight:600}
  .hidden{display:none}
  small{opacity:.5;margin-top:16px;word-break:break-all}
</style>
</head>
<body>
<div class="wrap">
  <img src="icon.png" alt="">
  <h1>Oxion</h1>
  <p id="msg">Загрузка…</p>
  <div class="spin" id="spin"></div>
  <button id="retry" class="hidden" onclick="go()">Повторить</button>
  <small id="dbg"></small>
</div>
<script src="config.js"></script>
<script>
  // Открываем Oxion с сервера. Если сервер не ответил за 20 секунд — показываем, что случилось.
  var URL_ = (window.OXION_URL || '').replace(/\/$/, '') + '/';
  function fail(text) {
    document.getElementById('msg').innerHTML = text;
    document.getElementById('spin').classList.add('hidden');
    document.getElementById('retry').classList.remove('hidden');
  }
  function go() {
    document.getElementById('msg').textContent = 'Загрузка…';
    document.getElementById('spin').classList.remove('hidden');
    document.getElementById('retry').classList.add('hidden');
    document.getElementById('dbg').textContent = URL_;
    if (!navigator.onLine) return fail('Нет интернета.<br>Проверьте связь и нажмите «Повторить».');
    var t = setTimeout(function () {
      fail('Сервер не отвечает.<br>Если у вас мобильный интернет — попробуйте Wi-Fi или VPN.');
    }, 20000);
    // быстрый пинг сервера, чтобы отличить «сервер недоступен» от «долгая загрузка»
    fetch(URL_ + 'manifest.webmanifest', { cache: 'no-store', mode: 'no-cors' })
      .then(function () { location.replace(URL_); })
      .catch(function (e) { clearTimeout(t); fail('Не удалось связаться с сервером.<br>' + (e && e.message ? e.message : '')); });
  }
  go();
</script>
</body>
</html>
