# Сборка iOS-приложения Oxion в облаке (Mac не нужен).
# Запуск: GitHub → вкладка Actions → «Сборка iOS (Oxion)» → Run workflow → вставить адрес PWA → Run.
# Результат: файл Oxion.ipa (без подписи) во вкладке Artifacts. Ставится на iPhone через Sideloadly.

name: Сборка iOS (Oxion)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      app_url:
        description: "Адрес Oxion (PWA)"
        required: true
        default: "https://fit-app.brootai.workers.dev"
      version:
        description: "Версия приложения"
        required: false
        default: "1.0.0"

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Подставить адрес приложения
        env:
          APP_URL: ${{ github.event.inputs.app_url || 'https://fit-app.brootai.workers.dev' }}
        run: |
          APP_URL="${APP_URL%/}"
          case "$APP_URL" in https://*) ;; *) echo "Адрес должен начинаться с https://"; exit 1;; esac
          node -e '
            const fs=require("fs");
            const c=JSON.parse(fs.readFileSync("capacitor.config.json","utf8"));
            c.server.url=process.env.APP_URL;
            c.server.allowNavigation=[new URL(process.env.APP_URL).host];
            fs.writeFileSync("capacitor.config.json", JSON.stringify(c,null,2));
          '
          cat capacitor.config.json

      - name: Установить Capacitor
        run: npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/ios@latest

      - name: Создать iOS-проект
        run: |
          npx cap add ios
          npx cap sync ios

      - name: Иконка, название, настройки
        env:
          VERSION: ${{ github.event.inputs.version || '1.0.0' }}
        run: |
          ICONDIR=ios/App/App/Assets.xcassets/AppIcon.appiconset
          rm -f $ICONDIR/*.png
          cp assets/icon-1024.png $ICONDIR/AppIcon-512@2x.png
          cat > $ICONDIR/Contents.json <<'JSON'
          {"images":[{"filename":"AppIcon-512@2x.png","idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}
          JSON
          PL=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Oxion" $PL || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Oxion" $PL
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" $PL || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" $PL
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" $PL
          /usr/libexec/PlistBuddy -c "Add :UIStatusBarStyle string UIStatusBarStyleLightContent" $PL || true
          /usr/libexec/PlistBuddy -c "Add :UIViewControllerBasedStatusBarAppearance bool false" $PL || true
          # разрешения, которые использует PWA (камера/фото для видео и аватаров, микрофон для звонков, геолокация для доставки)
          plutil -replace NSCameraUsageDescription -string "Oxion использует камеру, чтобы снимать видео и фото для профиля и ленты." $PL
          plutil -replace NSMicrophoneUsageDescription -string "Oxion использует микрофон для звонков и записи видео." $PL
          plutil -replace NSPhotoLibraryUsageDescription -string "Oxion открывает галерею, чтобы вы могли загрузить фото и видео." $PL
          plutil -replace NSLocationWhenInUseUsageDescription -string "Oxion использует геопозицию, чтобы показать тренеров рядом и адрес доставки." $PL
          cd ios/App
          sed -i '' "s/MARKETING_VERSION = [^;]*;/MARKETING_VERSION = ${VERSION:-1.0.0};/g" App.xcodeproj/project.pbxproj
          sed -i '' "s/CURRENT_PROJECT_VERSION = [^;]*;/CURRENT_PROJECT_VERSION = ${{ github.run_number }};/g" App.xcodeproj/project.pbxproj

      - name: Собрать (без подписи)
        run: |
          cd ios/App
          if [ -d App.xcworkspace ]; then TARGET="-workspace App.xcworkspace"; else TARGET="-project App.xcodeproj"; fi
          xcodebuild $TARGET -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -n 40
          APP="$RUNNER_TEMP/dd/Build/Products/Release-iphoneos/App.app"
          test -d "$APP" || { echo "App.app не найден — смотрите лог выше"; exit 1; }
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/Oxion.app"
          cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/Oxion.ipa" Payload
          ls -la "$GITHUB_WORKSPACE/Oxion.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: Oxion-ipa
          path: Oxion.ipa
          retention-days: 14
